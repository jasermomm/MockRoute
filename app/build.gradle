plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

def signingReady = [
    System.getenv("MOCKROUTE_KEYSTORE_FILE"),
    System.getenv("MOCKROUTE_KEYSTORE_PASSWORD"),
    System.getenv("MOCKROUTE_KEY_ALIAS"),
    System.getenv("MOCKROUTE_KEY_PASSWORD")
].every { it != null && !it.isBlank() }

android {
    namespace "com.jasermomm.mockroute"
    compileSdk 37

    defaultConfig {
        applicationId "com.jasermomm.mockroute"
        minSdk 26
        targetSdk 37
        // Keep a monotonically increasing internal code so tester builds can upgrade in place.
        versionCode 5
        versionName "1.0.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary true
        buildConfigField "String", "NOMINATIM_BASE_URL", '"https://nominatim.openstreetmap.org"'
        buildConfigField "String", "OSRM_BASE_URL", '"https://router.project-osrm.org"'
    }

    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(System.getenv("MOCKROUTE_KEYSTORE_FILE"))
                storePassword System.getenv("MOCKROUTE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MOCKROUTE_KEY_ALIAS")
                keyPassword System.getenv("MOCKROUTE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingReady ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    androidResources {
        // Exclude retired marker images left by the abandoned bundled-map attempt.
        ignoreAssetsPattern "map"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += [
            "/META-INF/{AL2.0,LGPL2.1}",
            "/META-INF/LICENSE.md",
            "/META-INF/LICENSE-notice.md"
        ]
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }

    testOptions {
        unitTests.returnDefaultValues true
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2026.08.00")
    androidTestImplementation platform("androidx.compose:compose-bom:2026.08.00")

    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
    implementation "androidx.datastore:datastore-preferences:1.2.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:core:1.7.0"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
}
