name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify proven map contracts
        run: node scripts/web-map-contract-test.mjs
      - name: Prepare release signing
        env:
          MOCKROUTE_KEYSTORE_BASE64: ${{ secrets.MOCKROUTE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MOCKROUTE_KEYSTORE_BASE64" ]; then
            printf '%s' "$MOCKROUTE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mockroute-release.jks"
          fi
      - name: Test, lint, and build
        run: ./gradlew clean test lint assembleDebug assembleRelease
        env:
          MOCKROUTE_KEYSTORE_FILE: ${{ runner.temp }}/mockroute-release.jks
          MOCKROUTE_KEYSTORE_PASSWORD: ${{ secrets.MOCKROUTE_KEYSTORE_PASSWORD }}
          MOCKROUTE_KEY_ALIAS: ${{ secrets.MOCKROUTE_KEY_ALIAS }}
          MOCKROUTE_KEY_PASSWORD: ${{ secrets.MOCKROUTE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: MockRoute-APKs
          path: app/build/outputs/apk/**/*.apk
      - name: Name release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk "MockRoute-${GITHUB_REF_NAME}.apk"
      - name: Attach release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MockRoute-*.apk
          body_path: RELEASE_NOTES.md

  map-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run real map rendering smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
